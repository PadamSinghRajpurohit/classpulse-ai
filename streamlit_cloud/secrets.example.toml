# Local mode is the default. No Streamlit Secrets are required to run locally.
# If you choose to deploy to Streamlit Community Cloud, it runs on Streamlit's
# servers; SQLite data then lives on that hosted runtime and may be reset.
AUTH_BACKEND = "local"

# Optional AI coach/quiz support. Use your own private key only if desired.
# Never commit a real API key to GitHub.
# GEMINI_API_KEY = "YOUR_PRIVATE_GEMINI_API_KEY"
# GEMINI_MODEL = "gemini-3.5-flash-lite"

# To keep your hosted account and class data across restarts, create/choose your
# own Supabase project and add these values in Streamlit Cloud → App settings →
# Secrets. These settings never point to the repository maintainer's database.
# AUTH_BACKEND = "supabase"
# SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"
# SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY"
# SUPABASE_SYNC_ENABLED = "true"
# The Supabase GitHub integration applies files under supabase/migrations.
# Never put a service-role key or a real credential in this file or GitHub.

